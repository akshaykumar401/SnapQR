<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapQR | {% block title %}Dynamic QR Code Studio{% endblock %}</title>
  <meta name="description" content="Generate high-resolution custom QR codes with personalized loading messages, branded redirect splash screens, and customizable designs.">
  <meta name="author" content="Silver Pixel Soft - https://silver-pixel-soft.pages.dev/">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome & Remix Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Base Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/Base.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/Logo.png') }}">

  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block content %}
  {% endblock %}

  {% block extra_js %}{% endblock %}
</body>
</html>
